[package]
name = "cdxrs"
version = "3.0.0"
edition = "2024"
description = "Rust-native CycloneDX BOM tooling for cdxgen"
license = "MIT"
repository = "https://github.com/CycloneDX/cdxgen-plugins-bin"

[lib]
name = "cdxrs"
path = "src/lib.rs"

[[bin]]
name = "cdxrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"
httpdate = "1"

[dev-dependencies]
insta = "1"
sha2 = "0.10"
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
