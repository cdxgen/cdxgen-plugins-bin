# One Kotlin version property per 08-VERSION-POLICY.md policy 1: it sets the
# compiler, the Analysis API artifacts and the published ceiling
# (runtime.kotlinVersion). Bump on every stable release; track the EAP in CI
# only, never in the release.
#
# The resolved front end (P1) runs on the same substrate KSP2 declares for the
# same Kotlin base version (google/ksp, kotlin-analysis-api): the unrelocated
# `-for-ide` split artifacts at `kotlin`, the IntelliJ platform modules at
# `intellijPlatform` — the version Kotlin itself pins in
# versions.intellijSdk for this release (verified against tag v2.4.0) — and
# the third-party libraries those modules' POMs resolve. 02-ARCHITECTURE.md
# §1 records the amendment; nothing outside this list may be added without
# amending that doc first.
[versions]
kotlin = "2.4.0"
intellijPlatform = "251.27812.49"
guava = "33.2.0-jre"
intellij-asm = "9.0"
stax2 = "4.2.1"
aalto-xml = "1.3.0"
streamex = "0.7.2"
fastutil = "8.5.14-jb1"
jna = "5.9.0.26"
trove4j = "1.0.20200330"
log4j = "1.2.17.2"
jdom = "2.0.6"
coroutines = "1.10.2"
kotlinx-serialization = "1.6.3"
jetbrains-annotations = "24.1.0"
lz4 = "1.7.1"
opentelemetry = "1.34.1"
collections-immutable = "0.3.4"
caffeine = "2.9.3"
javax-inject = "1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.13.4" }

# The Analysis API and the unrelocated compiler, split per KSP2's working
# set. Declared non-transitively: the POMs of the *-for-ide artifacts point
# at shadowed modules (analysis-api, analysis-api-standalone[-base],
# analysis-api-fir-standalone-base) that are not published anywhere (404 on
# Maven Central and on the JetBrains repo at 2.4.0 — recorded as P0
# deviation 2); transitive resolution would fail outright.
analysis-api-ide = { module = "org.jetbrains.kotlin:analysis-api-for-ide", version.ref = "kotlin" }
analysis-api-k2-ide = { module = "org.jetbrains.kotlin:analysis-api-k2-for-ide", version.ref = "kotlin" }
analysis-api-standalone-ide = { module = "org.jetbrains.kotlin:analysis-api-standalone-for-ide", version.ref = "kotlin" }
analysis-api-impl-base-ide = { module = "org.jetbrains.kotlin:analysis-api-impl-base-for-ide", version.ref = "kotlin" }
analysis-api-platform-ide = { module = "org.jetbrains.kotlin:analysis-api-platform-interface-for-ide", version.ref = "kotlin" }
low-level-api-fir-ide = { module = "org.jetbrains.kotlin:low-level-api-fir-for-ide", version.ref = "kotlin" }
symbol-light-classes-ide = { module = "org.jetbrains.kotlin:symbol-light-classes-for-ide", version.ref = "kotlin" }
compiler-common-ide = { module = "org.jetbrains.kotlin:kotlin-compiler-common-for-ide", version.ref = "kotlin" }
compiler-fir-ide = { module = "org.jetbrains.kotlin:kotlin-compiler-fir-for-ide", version.ref = "kotlin" }
compiler-fe10-ide = { module = "org.jetbrains.kotlin:kotlin-compiler-fe10-for-ide", version.ref = "kotlin" }
compiler-ir-ide = { module = "org.jetbrains.kotlin:kotlin-compiler-ir-for-ide", version.ref = "kotlin" }

# IntelliJ platform, unrelocated. These POMs resolve transitively and pull
# the remaining util-* modules plus their third-party dependencies.
platform-util-rt = { module = "com.jetbrains.intellij.platform:util-rt", version.ref = "intellijPlatform" }
platform-util-cl = { module = "com.jetbrains.intellij.platform:util-class-loader", version.ref = "intellijPlatform" }
platform-util-text-matching = { module = "com.jetbrains.intellij.platform:util-text-matching", version.ref = "intellijPlatform" }
platform-util = { module = "com.jetbrains.intellij.platform:util", version.ref = "intellijPlatform" }
platform-util-base = { module = "com.jetbrains.intellij.platform:util-base", version.ref = "intellijPlatform" }
platform-util-coroutines = { module = "com.jetbrains.intellij.platform:util-coroutines", version.ref = "intellijPlatform" }
platform-util-xml-dom = { module = "com.jetbrains.intellij.platform:util-xml-dom", version.ref = "intellijPlatform" }
platform-core = { module = "com.jetbrains.intellij.platform:core", version.ref = "intellijPlatform" }
platform-core-impl = { module = "com.jetbrains.intellij.platform:core-impl", version.ref = "intellijPlatform" }
platform-extensions = { module = "com.jetbrains.intellij.platform:extensions", version.ref = "intellijPlatform" }
platform-diagnostic = { module = "com.jetbrains.intellij.platform:diagnostic", version.ref = "intellijPlatform" }
platform-diagnostic-telemetry = { module = "com.jetbrains.intellij.platform:diagnostic-telemetry", version.ref = "intellijPlatform" }
java-frontback-psi = { module = "com.jetbrains.intellij.java:java-frontback-psi", version.ref = "intellijPlatform" }
java-frontback-psi-impl = { module = "com.jetbrains.intellij.java:java-frontback-psi-impl", version.ref = "intellijPlatform" }
java-psi = { module = "com.jetbrains.intellij.java:java-psi", version.ref = "intellijPlatform" }
java-psi-impl = { module = "com.jetbrains.intellij.java:java-psi-impl", version.ref = "intellijPlatform" }

# Third-party libraries the platform and the Analysis API resolve against.
# Declared explicitly (KSP2 does the same) so a platform bump cannot silently
# change this list; versions are the ones KSP2 pins for the same Kotlin base.
aa-guava = { module = "com.google.guava:guava", version.ref = "guava" }
aa-asm = { module = "org.jetbrains.intellij.deps:asm-all", version.ref = "intellij-asm" }
aa-stax2 = { module = "org.codehaus.woodstox:stax2-api", version.ref = "stax2" }
aa-aalto-xml = { module = "com.fasterxml:aalto-xml", version.ref = "aalto-xml" }
aa-streamex = { module = "one.util:streamex", version.ref = "streamex" }
aa-fastutil = { module = "org.jetbrains.intellij.deps.fastutil:intellij-deps-fastutil", version.ref = "fastutil" }
aa-jna = { module = "org.jetbrains.intellij.deps.jna:jna", version.ref = "jna" }
aa-jna-platform = { module = "org.jetbrains.intellij.deps.jna:jna-platform", version.ref = "jna" }
aa-trove4j = { module = "org.jetbrains.intellij.deps:trove4j", version.ref = "trove4j" }
aa-log4j = { module = "org.jetbrains.intellij.deps:log4j", version.ref = "log4j" }
aa-jdom = { module = "org.jetbrains.intellij.deps:jdom", version.ref = "jdom" }
aa-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
aa-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
aa-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
aa-lz4 = { module = "org.lz4:lz4-java", version.ref = "lz4" }
aa-opentelemetry = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
aa-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "collections-immutable" }
aa-caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
aa-javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
