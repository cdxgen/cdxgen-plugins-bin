# The Gradle daemon and every JVM it forks stay out of the macOS Dock and
# the focus list. intellij-core (pulled in by the Analysis API) initialises
# AWT, and without this a corpus run over the fixtures repeatedly grabs
# keyboard focus from whatever the user is doing. See HEADLESS_JVM_ARGS in
# build.gradle.kts and the same defence in the CLI's main().
# The daemon heap is PINNED at 1g: it only orchestrates (compilation runs in
# the Kotlin daemon, tests and the bench fork their own JVMs), and an
# unbounded daemon on a loaded CI runner is the OOM killer's first target —
# the pkg corpusQuick death was the whole gradle JVM SIGKILLed mid-run with
# zero output. The gate's peak-RSS number reads the BENCH fork's own VmHWM
# (PeakRss.bytes -> /proc/self/status), which this cap cannot touch.
org.gradle.jvmargs=-Djava.awt.headless=true -Dapple.awt.UIElement=true -Xmx1g
