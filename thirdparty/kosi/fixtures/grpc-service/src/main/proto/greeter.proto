// The service definition the Greeter stub is generated from. Inventory has
// no .proto here on purpose: its RPC path cannot be proven.
syntax = "proto3";

package helloworld;

service Greeter {
  // Sends a greeting.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  rpc StreamGreetings (HelloRequest) returns (stream HelloReply) {}
}

message HelloRequest { string name = 1; }
message HelloReply { string message = 1; }
