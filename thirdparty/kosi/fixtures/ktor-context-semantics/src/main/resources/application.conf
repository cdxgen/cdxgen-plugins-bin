# Ktor's own configuration file. It is HOCON — brace-nested, not a flat
# properties or yaml file — which is why `ktor.deployment.rootPath` was a
# base-path key nothing could ever supply.
ktor {
    deployment {
        port = 8080
        rootPath = "/gateway"
    }
    application {
        modules = [ fixtures.ktorcontext.ApplicationKt.module ]
    }
}
