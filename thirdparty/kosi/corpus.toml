# P16 §3: the catch handler's own PARAMETER. P15's edges made the handler
# reachable but bound `e` to nothing — a read of it lowered as a field read
# on `this`, so `catch (e) { sink("$e") }` after `throw E(userInput)` (the
# wrap-and-rethrow idiom InsecureShop itself uses) could never report. The
# parameter is bound at the dispatch edge: a visible throw's thrown register
# AND its construction arguments (the fresh object is clean; the message is
# the argument) at the throw site, and an unknown-but-tainted-if-the-body-was
# seed at the dispatch edge where no throw is visible. Negative halves: a
# clean visible throw must not report (it suppresses the seed), and a clean
# body's unknown exception must stay clean.
[[fixtures]]
