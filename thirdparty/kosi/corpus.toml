# kosi corpus manifest. Modeled on rusi's corpus.toml (06-CORPUS.md).
#
# Tiers:
#   fixtures - bundled micro-projects under fixtures/, no network, run on every change
#   small    - small real repos, SHA-pinned, fetched into .corpus-cache/<slug>/, run on every change
#   medium   - larger repos, per phase / nightly (entries land with their enabling phase)
#   large    - on demand
#   android / kmp / hybrid - per phase
#   vuln     - intentionally vulnerable, ground truth, every change
#   ported   - DroidBench/Ghera cases rewritten in idiomatic Kotlin, every change
#
# capabilities are recorded, not enforced. expected_flows points at a JSONL
# file of hand-annotated ground truth for pinned repos; bundled fixtures carry
# their expectations as kosi:want annotations in the sources themselves.
#
# tolerated_resolution_errors (P18): the ERROR-severity resolution classes the
# entry's sources legitimately carry. A class that appears without being
# declared fails the row — a fixture whose stub stopped typechecking (R110)
# otherwise passed every want over code the compiler rejects. An empty list
# declares "typechecks clean"; repo-tier entries carry no field (real code
# under partial classpaths resolves legitimately imperfectly).

[[fixtures]]
slug = "scope-functions"
tier = "fixtures"
path = "fixtures/scope-functions"
capabilities = ["scope-functions", "null-safety"]
tolerated_resolution_errors = []

[[fixtures]]
slug = "null-safety"
tier = "fixtures"
path = "fixtures/null-safety"
capabilities = ["elvis-join", "safe-call"]
tolerated_resolution_errors = []

