# P18 (R111): the dependency-marker contract from both sides. The present
# marker is bound to a jar whose FILE NAME does not contain the marker (only
# the coordinate arm can match); the absent marker is a version no cache
# holds (missing[] must not publish). Until P18 the coordinate arm rendered
# a literal template and the missing list counted as presence — the wants on
# implicit-routes passed through both holes on cold machines.

