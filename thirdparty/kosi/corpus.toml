# P9: cross-dependency taint. The dependency is a COMMITTED jar
# (libs/dep-helper.jar, built by helper-src/build.sh from the Kotlin source
# beside it); classpath.txt names it, and the `deps` matrix slot lowers it
# into the KIR and summarises it (origin=bytecode). The body-less records
# (an interface method, an abstract method) are the phase's most important
# negative: they must be excluded entirely, never summarised as "no flow".

[[fixtures]]
slug = "dep-taint-through-lib"
tier = "fixtures"
path = "fixtures/dep-taint-through-lib"
classpath_file = "classpath.txt"
capabilities = ["deps", "bytecode-summaries", "cross-dependency", "bodyless-records", "source-returns"]
tolerated_resolution_errors = []

