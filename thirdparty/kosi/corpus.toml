# P3 call-graph fixtures: dispatch modes, sealed narrowing, exported roots
# and framework-registration roots. Each carries a negative half naming what
# a plausibly wrong dispatcher would emit.

# Access paths deeper than one field (R63): the corpus was entirely flat, so
# the depth-5 cap `AccessPath` has carried since P2 was never exercised and a
# lowering that emitted length-one paths only read 1.000 recall.

[[fixtures]]
slug = "nested-field-path"
tier = "fixtures"
path = "fixtures/nested-field-path"
capabilities = ["taint", "field-sensitivity", "summaries", "clean-sibling"]

