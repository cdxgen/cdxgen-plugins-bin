# Rusi real-world + fixture corpus.
#
# Each entry pins an EXACT upstream SHA so analysis is reproducible. The
# fetcher (scripts/corpus/fetch.py) clones+checks out the SHA into
# .corpus-cache/<slug>/ and the runner (scripts/eval/run.py) points rusi
# at that directory.
#
# tiers:
#   fixtures  - bundled under ./fixtures/, always present (no network)
#   small     - small real projects, run every change
#   medium    - larger projects, run per phase / nightly
#   large     - run on demand
#   hybrid    - Rust+C FFI projects (P7)
#   vuln      - intentionally vulnerable / ground-truth (P0.4)
#
# `capabilities` is a free-form list of the engine features the project
# exercises; it is recorded in the eval report but not enforced.
#
# `features` (optional) is passed to the rusi CLI via `--features` once
# P9.2 lands; currently unused by the stable backend.
#
# `expected_flows` (optional) is a relative path (inside the repo) to a
# JSONL file of hand-annotated ground-truth flows used to compute
# precision/recall (see scripts/eval/run.py --metrics).

# ---------------------------------------------------------------------------
# Bundled fixtures tier (always present; no network needed).
# ---------------------------------------------------------------------------
[[fixtures]]
slug = "vulnerable-web-app"
tier = "fixtures"
path = "fixtures/vulnerable-web-app"
capabilities = ["sqli", "ssrf", "xss", "redirect"]
expected_flows = "expected.jsonl"

