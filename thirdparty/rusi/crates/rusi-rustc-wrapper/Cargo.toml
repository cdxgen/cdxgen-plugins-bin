[package]
name = "rusi-rustc-wrapper"
version.workspace = true
edition.workspace = true
# Built through the embedded wrapper path on the 1.98 rustc_private floor,
# so this is a literal rather than the workspace inherit.
rust-version = "1.98"
license.workspace = true

[[bin]]
name = "rusi-rustc-wrapper"
path = "src/main.rs"
bench = false

[dependencies]
anyhow.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
rusi-schema = { path = "../rusi-schema" }
