[workspace]
members = ["crates/rusi-schema", "crates/rusi-core", "crates/rusi-driver", "crates/rusi-cli", "crates/rusi-rustc-wrapper"]
# The rustc-wrapper links rustc internals via `#![feature(rustc_private)]`, which
# only builds on a nightly toolchain with the rustc-dev component. It is kept out
# of the default set so plain `cargo build`/`cargo test` work on stable; the
# driver builds it explicitly with the resolved nightly toolchain at runtime.
default-members = [
    "crates/rusi-schema",
    "crates/rusi-core",
    "crates/rusi-driver",
    "crates/rusi-cli",
]
# Bundled fixtures + cached real-world corpus are independent Cargo projects
# that must NOT be absorbed into this workspace (cargo metadata would otherwise
# refuse to load them). Each carries its own `[workspace]` table where needed.
exclude = [
    "fixtures",
    ".corpus-cache",
]
resolver = "2"

[workspace.package]
version = "3.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
pretty_assertions = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
opt-level = "z"
strip = "symbols"
