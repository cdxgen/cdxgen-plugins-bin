[workspace]
members = ["crates/rusi-schema", "crates/rusi-core", "crates/rusi-driver", "crates/rusi-cli", "crates/rusi-rustc-wrapper"]
# The rustc-wrapper links rustc internals via `#![feature(rustc_private)]`,
# unlocked by RUSTC_BOOTSTRAP on the pinned stable channel that carries the
# rustc-dev and rust-src components (see evaluate_backend_support in
# crates/rusi-driver). It is kept out of the default set so plain `cargo
# build`/`cargo test` stay light; the driver builds it explicitly with the
# resolved toolchain at runtime.
default-members = [
    "crates/rusi-schema",
    "crates/rusi-core",
    "crates/rusi-driver",
    "crates/rusi-cli",
]
# Bundled fixtures + cached real-world corpus are independent Cargo projects
# that must NOT be absorbed into this workspace (cargo metadata would otherwise
# refuse to load them). Each carries its own `[workspace]` table where needed.
exclude = [
    "fixtures",
    ".corpus-cache",
]
resolver = "2"

[workspace.package]
version = "4.0.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
pretty_assertions = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }

# Shared release profile across the Rust tools (cdxrs, cdxui, rusi): thin
# LTO, abort on panic, size-optimized, stripped. Kept in lockstep so the
# shipped binaries behave and compress the same way.
[profile.release]
codegen-units = 1
debug = false
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
