[package]
name = "cdxui"
version = "4.0.2"
edition = "2024"
rust-version = "1.98"
description = "Interactive terminal UI for CycloneDX BOM exploration"
license = "MIT"
repository = "https://github.com/CycloneDX/cdxgen-plugins-bin"

[[bin]]
name = "cdxui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"
strip-ansi-escapes = "0.2"

[dev-dependencies]
tempfile = "3"

# Shared release profile across the Rust tools (cdxrs, cdxui, rusi): thin
# LTO, abort on panic, size-optimized, stripped. Kept in lockstep so the
# shipped binaries behave and compress the same way.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
