name: Build npm package

on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  rusi_linux_prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
    - name: Install Zig
      run: |
        bash ./scripts/thirdparty-downloads.sh install-zig linux-amd64 "$HOME/.local/zig"
        echo "$HOME/.local/zig" >> "$GITHUB_PATH"
        "$HOME/.local/zig/zig" version
    - name: Build Rusi Linux, musl, and Windows helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/rusi
        make bootstrap-linux
        npm install -g @cyclonedx/cdxgen
        make linux linuxmusl windows sbom
        popd
    - name: Upload Rusi Linux helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: rusi-build-linux
        path: thirdparty/rusi/build/
        if-no-files-found: error
        retention-days: 1
  rusi_darwin_prebuild:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build Rusi Darwin helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/rusi
        make bootstrap-darwin
        make darwin
        popd
    - name: Upload Rusi Darwin helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: rusi-build-darwin
        path: |
          thirdparty/rusi/build/rusi-darwin-*
          thirdparty/rusi/build/rusi-darwin-*.sha256
        if-no-files-found: error
        retention-days: 1
  cdxui_linux_prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
    - name: Install Zig
      run: |
        bash ./scripts/thirdparty-downloads.sh install-zig linux-amd64 "$HOME/.local/zig"
        echo "$HOME/.local/zig" >> "$GITHUB_PATH"
        "$HOME/.local/zig/zig" version
    - name: Build cdxui Linux, musl, and Windows helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/cdxui
        make bootstrap-linux
        npm install -g @cyclonedx/cdxgen
        make linux linuxmusl windows sbom
        popd
    - name: Upload cdxui Linux helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: cdxui-build-linux
        path: thirdparty/cdxui/build/
        if-no-files-found: error
        retention-days: 1
  cdxui_darwin_prebuild:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build cdxui Darwin helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/cdxui
        make bootstrap-darwin
        make darwin
        popd
    - name: Upload cdxui Darwin helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: cdxui-build-darwin
        path: |
          thirdparty/cdxui/build/cdxui-darwin-*
          thirdparty/cdxui/build/cdxui-darwin-*.sha256
        if-no-files-found: error
        retention-days: 1
  cdxrs_linux_prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
        package-manager-cache: false
    - name: Install Zig
      run: |
        bash ./scripts/thirdparty-downloads.sh install-zig linux-amd64 "$HOME/.local/zig"
        echo "$HOME/.local/zig" >> "$GITHUB_PATH"
        "$HOME/.local/zig/zig" version
    - name: Build cdxrs Linux, musl, and Windows helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/cdxrs
        make bootstrap-linux
        npm install -g @cyclonedx/cdxgen
        make linux linuxmusl windows sbom
        popd
    - name: Upload cdxrs Linux helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: cdxrs-build-linux
        path: thirdparty/cdxrs/build/
        if-no-files-found: error
        retention-days: 1
  cdxrs_darwin_prebuild:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build cdxrs Darwin helper artifacts
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        pushd thirdparty/cdxrs
        make bootstrap-darwin
        make darwin
        popd
    - name: Upload cdxrs Darwin helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: cdxrs-build-darwin
        path: |
          thirdparty/cdxrs/build/cdxrs-darwin-*
          thirdparty/cdxrs/build/cdxrs-darwin-*.sha256
        if-no-files-found: error
        retention-days: 1
  # kosi builds its own natives here, like every other built plugin, instead
  # of waiting on native-builds.yml to push a ghcr cache tag: that run takes
  # 30-60 minutes and the flavour scripts waited six, so PR packaging raced a
  # workflow it could never win against. Every platform kosi CLAIMS
  # (scripts/plugin-platform-support.sh) is built by one of these three jobs;
  # the rest are named exemptions served by the kosi-portable.jar fallback.
  kosi_linux_prebuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5
      with:
        distribution: temurin
        java-version: 21
    - name: Build musl zlib (the musl static link needs -lz against musl)
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        # zlib's ./configure chokes on the musl-gcc wrapper ('compiler error
        # reporting is too harsh'), so compile the objects directly — the
        # distro's zlib1g-dev is glibc-linked and useless to the musl image.
        curl -fsSL -o /tmp/zlib.tar.gz \
          https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
        mkdir -p /tmp/zlibsrc
        tar xzf /tmp/zlib.tar.gz -C /tmp/zlibsrc --strip-components=1
        pushd /tmp/zlibsrc
        objs=''
        for src in adler32 compress crc32 deflate gzclose gzlib gzread gzwrite infback inffast inflate inftrees trees uncompr zutil; do
          musl-gcc -O2 -D_LARGEFILE64_SOURCE=1 -c "$src.c"
          objs="$objs $src.o"
        done
        ar rc libz.a $objs
        mkdir -p "$HOME/musl-zlib/lib"
        cp libz.a "$HOME/musl-zlib/lib/"
        popd
        echo "KOSI_NATIVE_LINKER_FLAGS=-H:NativeLinkerOption=-L$HOME/musl-zlib/lib" >> "$GITHUB_ENV"
    - name: Build kosi linux-amd64 and linuxmusl-amd64 natives
      run: |
        mkdir -p "$HOME/tools"
        curl -fsSL -o /tmp/graalvm.tar.gz \
          https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_linux-x64_bin.tar.gz
        # R66: the toolchain is part of the build contract; pinned here to the
        # same digest native-builds.yml uses.
        echo "b2bc38d0c4141426eb44d0eefa3cc172c96faf92727d703b61541699128b6fc7  /tmp/graalvm.tar.gz" | sha256sum -c -
        tar xzf /tmp/graalvm.tar.gz -C "$HOME/tools/"
        pushd thirdparty/kosi
        make linux linuxmusl
        popd
    - name: Isolated binary smoke (kosi-linux-amd64)
      run: |
        # kosi ships as ONE file, so it is smoke-tested as one file: copied
        # away from the build directory native-image fills with libawt*
        # jdk_library artifacts (R97 — every published binary before this
        # reported all components unavailable outside ./build).
        mkdir -p /tmp/kosi-isolated
        cp thirdparty/kosi/build/kosi-linux-amd64 /tmp/kosi-isolated/
        cd /tmp/kosi-isolated
        ./kosi-linux-amd64 version | tee /tmp/version.json
        python3 -c 'import json,sys; c=json.load(open("/tmp/version.json"))["components"]; bad={k:v for k,v in c.items() if v!="available"}; sys.exit(f"components unavailable in an isolated binary: {bad}" if bad else 0)'
        ./kosi-linux-amd64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/command-exec" --backend resolved --dataflow all --out /tmp/c.json
        grep -q 'taint/untrusted-input-to-process-exec' /tmp/c.json
    - name: Upload kosi Linux helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: kosi-build-linux
        path: |
          thirdparty/kosi/build/kosi-linux-amd64*
          thirdparty/kosi/build/kosi-linuxmusl-amd64*
        if-no-files-found: error
        retention-days: 1
  kosi_linux_arm64_prebuild:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5
      with:
        distribution: temurin
        java-version: 21
    - name: Build kosi linux-arm64 native
      run: |
        mkdir -p "$HOME/tools"
        curl -fsSL -o /tmp/graalvm.tar.gz \
          https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_linux-aarch64_bin.tar.gz
        echo "7e8a3fbc2e4c28566107039a298cef690d86a37599a8e50536fc5a65b7f1bd56  /tmp/graalvm.tar.gz" | sha256sum -c -
        tar xzf /tmp/graalvm.tar.gz -C "$HOME/tools/"
        # No linuxmusl here: GraalVM does not support musl static images on
        # linux-aarch64, which is why linuxmusl-arm64 is a declared exemption.
        pushd thirdparty/kosi
        make linux
        popd
    - name: Isolated binary smoke (kosi-linux-arm64)
      run: |
        # kosi ships as ONE file, so it is smoke-tested as one file: copied
        # away from the build directory native-image fills with libawt*
        # jdk_library artifacts (R97 — every published binary before this
        # reported all components unavailable outside ./build).
        mkdir -p /tmp/kosi-isolated
        cp thirdparty/kosi/build/kosi-linux-arm64 /tmp/kosi-isolated/
        cd /tmp/kosi-isolated
        ./kosi-linux-arm64 version | tee /tmp/version.json
        python3 -c 'import json,sys; c=json.load(open("/tmp/version.json"))["components"]; bad={k:v for k,v in c.items() if v!="available"}; sys.exit(f"components unavailable in an isolated binary: {bad}" if bad else 0)'
        ./kosi-linux-arm64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/command-exec" --backend resolved --dataflow all --out /tmp/c.json
        grep -q 'taint/untrusted-input-to-process-exec' /tmp/c.json
    - name: Upload kosi Linux arm64 helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: kosi-build-linux-arm64
        path: |
          thirdparty/kosi/build/kosi-linux-arm64*
        if-no-files-found: error
        retention-days: 1
  kosi_darwin_prebuild:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5
      with:
        distribution: temurin
        java-version: 21
    - name: Build kosi darwin-arm64 native
      run: |
        mkdir -p "$HOME/tools"
        curl -fsSL -o /tmp/graalvm.tar.gz \
          https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_macos-aarch64_bin.tar.gz
        echo "ebfab1d74420f355a459076162012d6835fa6068bd9d2f230f1fcaf7ee0dd923  /tmp/graalvm.tar.gz" | shasum -a 256 -c -
        tar xzf /tmp/graalvm.tar.gz -C "$HOME/tools/"
        # darwin-amd64 has no GraalVM at all for JDK 25, in Community or
        # Oracle; it is an exemption, not a build this job is missing.
        pushd thirdparty/kosi
        make darwin
        popd
    - name: Isolated binary smoke (kosi-darwin-arm64)
      run: |
        # kosi ships as ONE file, so it is smoke-tested as one file: copied
        # away from the build directory native-image fills with libawt*
        # jdk_library artifacts (R97 — every published binary before this
        # reported all components unavailable outside ./build).
        mkdir -p /tmp/kosi-isolated
        cp thirdparty/kosi/build/kosi-darwin-arm64 /tmp/kosi-isolated/
        cd /tmp/kosi-isolated
        ./kosi-darwin-arm64 version | tee /tmp/version.json
        python3 -c 'import json,sys; c=json.load(open("/tmp/version.json"))["components"]; bad={k:v for k,v in c.items() if v!="available"}; sys.exit(f"components unavailable in an isolated binary: {bad}" if bad else 0)'
        ./kosi-darwin-arm64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/command-exec" --backend resolved --dataflow all --out /tmp/c.json
        grep -q 'taint/untrusted-input-to-process-exec' /tmp/c.json
    - name: Upload kosi Darwin helper artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: kosi-build-darwin
        path: |
          thirdparty/kosi/build/kosi-darwin-arm64*
        if-no-files-found: error
        retention-days: 1
  pkg:
    needs:
    - rusi_linux_prebuild
    - rusi_darwin_prebuild
    - cdxui_linux_prebuild
    - cdxui_darwin_prebuild
    - cdxrs_linux_prebuild
    - cdxrs_darwin_prebuild
    - kosi_linux_prebuild
    - kosi_linux_arm64_prebuild
    - kosi_darwin_prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
        registry-url: https://registry.npmjs.org/
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '^1.27.0'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
    - run: oras version
    - name: Trim CI agent
      run: |
        chmod +x contrib/free_disk_space.sh
        ./contrib/free_disk_space.sh
    - name: Run packaging helper tests
      run: |
        bash ./scripts/assert-trivy-cdxgen-sbom.test.sh
        bash ./scripts/check-package-size.test.sh
        bash ./scripts/thirdparty-downloads.test.sh
        bash ./scripts/stage-built-plugins.test.sh
        bash ./scripts/publish-helper-oras.test.sh
        bash ./scripts/root-package-publish.test.sh
        node --test ./scripts/generate-metadata.test.js
    - name: Download Rusi helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: rusi-build-linux
        path: thirdparty/rusi/build
    - name: Download Rusi Darwin helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: rusi-build-darwin
        path: thirdparty/rusi/build
    - name: Download cdxui Linux helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: cdxui-build-linux
        path: thirdparty/cdxui/build
    - name: Download cdxui Darwin helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: cdxui-build-darwin
        path: thirdparty/cdxui/build
    - name: Download cdxrs Linux helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: cdxrs-build-linux
        path: thirdparty/cdxrs/build
    - name: Download cdxrs Darwin helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: cdxrs-build-darwin
        path: thirdparty/cdxrs/build
    - name: Download kosi Linux helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: kosi-build-linux
        path: thirdparty/kosi/build
    - name: Download kosi Linux arm64 helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: kosi-build-linux-arm64
        path: thirdparty/kosi/build
    - name: Download kosi Darwin helper artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: kosi-build-darwin
        path: thirdparty/kosi/build
    - name: Build
      run: |
        npm install -g @cyclonedx/cdxgen
        bash ./scripts/thirdparty-downloads.sh install-upx linux-amd64 ./upx
        sudo install -m 0755 ./upx /usr/local/bin/upx
        rm -f ./upx
        # kosi arrives prebuilt from the three kosi_*_prebuild jobs, so
        # build.sh takes its `make sbom` path and no GraalVM toolchain is
        # needed in this job.
        chmod +x thirdparty/kosi/build/kosi-*
        bash build.sh
        [[ -f packages/linuxmusl-amd64/plugins/golem/golem-linuxmusl-amd64 ]]
        [[ -f packages/linuxmusl-amd64/plugins/golem/golem-linuxmusl-amd64.sha256 ]]
        [[ -f packages/linuxmusl-amd64/plugins/rusi/rusi-linuxmusl-amd64 ]]
        [[ -f packages/linuxmusl-amd64/plugins/rusi/rusi-linuxmusl-amd64.sha256 ]]
        [[ -f packages/linuxmusl-amd64/plugins/trustinspector/trustinspector-cdxgen-linuxmusl-amd64 ]]
        [[ -f packages/linuxmusl-amd64/plugins/trustinspector/trustinspector-cdxgen-linuxmusl-amd64.sha256 ]]
        [[ -f packages/linuxmusl-arm64/plugins/golem/golem-linuxmusl-arm64 ]]
        [[ -f packages/linuxmusl-arm64/plugins/golem/golem-linuxmusl-arm64.sha256 ]]
        [[ -f packages/linuxmusl-arm64/plugins/rusi/rusi-linuxmusl-arm64 ]]
        [[ -f packages/linuxmusl-arm64/plugins/rusi/rusi-linuxmusl-arm64.sha256 ]]
        [[ -f packages/linuxmusl-arm64/plugins/trustinspector/trustinspector-cdxgen-linuxmusl-arm64 ]]
        [[ -f packages/linuxmusl-arm64/plugins/trustinspector/trustinspector-cdxgen-linuxmusl-arm64.sha256 ]]
        [[ -f packages/darwin-arm64/plugins/rusi/rusi-darwin-arm64 ]]
        [[ -f packages/darwin-arm64/plugins/rusi/rusi-darwin-arm64.sha256 ]]
        [[ -f packages/darwin-amd64/plugins/rusi/rusi-darwin-amd64 ]]
        [[ -f packages/darwin-amd64/plugins/rusi/rusi-darwin-amd64.sha256 ]]
        [[ -f packages/darwin-arm64/plugins/cdxui/cdxui-darwin-arm64 ]]
        [[ -f packages/darwin-arm64/plugins/cdxui/cdxui-darwin-arm64.sha256 ]]
        [[ -f packages/darwin-amd64/plugins/cdxui/cdxui-darwin-amd64 ]]
        [[ -f packages/darwin-amd64/plugins/cdxui/cdxui-darwin-amd64.sha256 ]]
        [[ -f packages/windows-amd64/plugins/rusi/rusi-windows-amd64.exe ]]
        [[ -f packages/windows-amd64/plugins/rusi/rusi-windows-amd64.exe.sha256 ]]
        [[ -f packages/windows-amd64/plugins/cdxui/cdxui-windows-amd64.exe ]]
        [[ -f packages/windows-amd64/plugins/cdxui/cdxui-windows-amd64.exe.sha256 ]]
        # kosi on every platform it claims. check-plugin-coverage.sh inside
        # build.sh is the authority, but it reads its exemptions from a table
        # someone can edit; these four lines are the second opinion.
        for kosi_platform in linux-amd64 linux-arm64 linuxmusl-amd64 darwin-arm64; do
          [[ -f "packages/$kosi_platform/plugins/kosi/kosi-$kosi_platform" ]]
          [[ -f "packages/$kosi_platform/plugins/kosi/kosi-$kosi_platform.sha256" ]]
        done
        bash ./scripts/root-package-publish.test.sh
        npm publish --dry-run
      env:
        NODE_OPTIONS: --max_old_space_size=4096        
    - name: Upload packaged plugins
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: packaged-plugins
        path: packages/
        if-no-files-found: error
        retention-days: 1
  pkg_publish:
    needs: pkg
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package_name:
        - windows-amd64
        - linux-amd64
        - linux-arm64
        - linuxmusl-amd64
        - linuxmusl-arm64
        - linux-riscv64
        - linux-arm
        - windows-arm64
        - darwin-arm64
        - darwin-amd64
        - ppc64
    steps:
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
        registry-url: https://registry.npmjs.org/
    - name: Download packaged plugins
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: packaged-plugins
        path: .
    - name: Verify package publish dry-run
      run: |
        package_name='${{ matrix.package_name }}'
        package_dir=''
        for candidate in \
          "packages/${package_name}" \
          "${package_name}" \
          "packages/packages/${package_name}"
        do
          if [[ -d "$candidate" ]]; then
            package_dir="$candidate"
            break
          fi
        done

        if [[ -z "$package_dir" ]]; then
          echo "Downloaded package directory not found for ${package_name}" >&2
          find . -maxdepth 3 -type d | sort >&2
          exit 1
        fi

        pushd "$package_dir"
        npm publish --dry-run
        popd
  winpkg:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 25.x
        registry-url: https://registry.npmjs.org/
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '^1.27.0'
        cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: Build
      run: |
        npm install -g @cyclonedx/cdxgen
        .\build.ps1
    - name: Windows trustinspector E2E smoke
      shell: pwsh
      run: |
        $ManifestPath = Join-Path (Get-Location) 'plugins\plugins-manifest.json'
        if (-not (Test-Path $ManifestPath)) {
          throw 'plugins-manifest.json was not generated on Windows.'
        }
        $Manifest = Get-Content $ManifestPath -Raw | ConvertFrom-Json
        if (-not ($Manifest.plugins.name -contains 'trustinspector')) {
          throw 'trustinspector metadata was not recorded in plugins-manifest.json.'
        }

        $TrustInspector = Join-Path (Get-Location) 'plugins\trustinspector\trustinspector-cdxgen-windows-amd64.exe'
        if (-not (Test-Path $TrustInspector)) {
          throw 'trustinspector helper was not staged in plugins\trustinspector.'
        }

        $HostResult = & $TrustInspector host | Out-String | ConvertFrom-Json
        if ($null -eq $HostResult.hostFindings) {
          throw 'trustinspector host output did not include hostFindings.'
        }

        $Candidates = [System.Collections.Generic.List[string]]::new()
        foreach ($CommandName in @('powershell.exe', 'pwsh.exe')) {
          try {
            $Resolved = (Get-Command $CommandName -ErrorAction Stop | Select-Object -First 1).Source
            if ($Resolved -and (Test-Path $Resolved)) {
              $Candidates.Add($Resolved)
            }
          } catch {
          }
        }
        foreach ($PathCandidate in @(
          (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'),
          (Join-Path $env:SystemRoot 'System32\cmd.exe'),
          (Join-Path $env:SystemRoot 'System32\notepad.exe'),
          $TrustInspector
        )) {
          if ($PathCandidate -and (Test-Path $PathCandidate)) {
            $Candidates.Add($PathCandidate)
          }
        }
        $TargetBinary = $Candidates | Select-Object -Unique | Select-Object -First 1
        if (-not $TargetBinary) {
          throw 'Unable to locate any Windows executable to inspect with trustinspector.'
        }
        $PathResult = & $TrustInspector paths $TargetBinary | Out-String | ConvertFrom-Json
        if (($PathResult.inspections | Measure-Object).Count -lt 1) {
          throw "trustinspector paths output did not include any inspections for target $TargetBinary."
        }
        if (-not ($PathResult.inspections[0].properties | Where-Object { $_.name -eq 'cdx:windows:authenticode:status' })) {
          throw 'trustinspector paths output did not include Authenticode status properties.'
        }
