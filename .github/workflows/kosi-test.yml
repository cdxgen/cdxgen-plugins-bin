name: kosi test

on:
  push:
    # feat/kosi is the kosi integration branch: phase branches squash-merge
    # into it and the tests must hold THERE, not only on main (the two failed
    # runs after the P14 merge were pushes to feat/kosi nobody was watching).
    branches: [main, feat/kosi]
    paths:
      - "thirdparty/kosi/**"
      - ".github/workflows/kosi-test.yml"
  pull_request:
    paths:
      - "thirdparty/kosi/**"
      - ".github/workflows/kosi-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: thirdparty/kosi

jobs:
  # Unit tests + the fixture-tier corpus ratchet (both modes) + digest goldens.
  # Every tier task named in the docs is exercised here; a renamed or missing
  # tier task fails this job.
  test:
    name: gradle build + corpusQuick + golden
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle build (unit + fixture tiers)
        run: ./gradlew build --no-daemon
      - name: Corpus ratchet (fixtures tier, security + all)
        run: ./gradlew corpusQuick --no-daemon
      - name: Digest goldens
        run: ./gradlew golden --no-daemon
      - name: PSI reflection metadata is current
        # Derived from the jar, not traced from a run: a Kotlin syntax kind
        # the fixtures do not contain used to kill the native binary at the
        # first file that used it (R98).
        run: make psi-metadata-check
      - name: Tier task presence
        run: ./gradlew corpusTierList --no-daemon --console=plain -q

  # Pinned real-repo tiers. Fetches through git into .corpus-cache/ at exact
  # SHAs; a repo that moves upstream still resolves because of the pin.
  # ON DEMAND (workflow_dispatch). The pinned-repo matrix does not fit a
  # hosted runner: the warm step alone took 52 minutes on 2026-09-15
  # (http4k's monorepo 42 of them), and the job was SIGTERM'd (exit 143)
  # 56 minutes in, during nowinandroid's warm, without reaching a single
  # bench row. corpusFull is measured per phase on the corpus machine and
  # its numbers — rows, fail/XPASS, the vuln finding floors, every repo's
  # resolvedCallRatio — are reported in the phase tracker; that
  # is where the gate lives. Keeping a job here that has never once
  # completed only teaches everyone to ignore a red tick.
  corpus-full:
    name: corpusFull (fixtures + pinned repos, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165  # v5
        with:
          distribution: temurin
          java-version: 21
      # P14: the vuln-repo finding floors are measured against warmed
      # classpaths, and a declared classpath that is missing FAILS its bench
      # row — so CI warms before it benches.
      - name: Warm repo classpaths
        run: |
          for tier in vuln-repo small medium android kmp hybrid; do
            ./scripts/warm-corpus-classpath.sh --tier "$tier" || \
              echo "WARNING: warming tier $tier failed; corpusFull will name the rows"
          done
        working-directory: thirdparty/kosi
      - name: Corpus full tier
        run: ./gradlew corpusFull --no-daemon

  # ON DEMAND (workflow_dispatch). The native-image spike must keep working —
  # the binary builds, runs, and its output is byte-identical across runs —
  # but a ~30-minute macOS image build on every push is not a per-push gate.
  # It is run locally per phase (`make native`, `scripts/determinism-sweep.sh`,
  # `make native-metadata-check`, and `scripts/native-vs-jvm.sh` when
  # reflection, resources or lowering changed) and reported in that phase's
  # tracker section. Per-push CI keeps the fast, deterministic subset:
  # unit tests, the fixture-tier corpus ratchet, and the digest goldens.
  native:
    name: make native (darwin-arm64, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned GraalVM (see Makefile GRAAL_HOME)
        run: |
          mkdir -p "$HOME/tools"
          curl -fsSL -o /tmp/graalvm.tar.gz \
            https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_macos-aarch64_bin.tar.gz
          echo "ebfab1d74420f355a459076162012d6835fa6068bd9d2f230f1fcaf7ee0dd923  /tmp/graalvm.tar.gz" | shasum -a 256 -c -
          tar xzf /tmp/graalvm.tar.gz -C "$HOME/tools/"
      - name: make native
        run: make native
      - name: Binary smoke (isolated; version + determinism)
        run: |
          # Run it the way it SHIPS — one file, no build directory around it
          # (R97). See the linux job for why.
          mkdir -p /tmp/kosi-isolated
          cp ./build/kosi-darwin-arm64 /tmp/kosi-isolated/
          cd /tmp/kosi-isolated
          ./kosi-darwin-arm64 version | tee /tmp/version.json
          python3 -c 'import json,sys; c=json.load(open("/tmp/version.json"))["components"]; bad={k:v for k,v in c.items() if v!="available"}; sys.exit(f"components unavailable in an isolated binary: {bad}" if bad else 0)'
          ./kosi-darwin-arm64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/weak-crypto" --out /tmp/a.json
          ./kosi-darwin-arm64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/weak-crypto" --out /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
      - name: Reachability metadata drift check
        run: make native-metadata-check

  # On-demand (workflow_dispatch): the linux-native path through the pinned
  # GraalVM, exercising `make linux` exactly as the release workflow calls it.
  native-linux:
    name: make linux (linux-amd64, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned GraalVM (see Makefile GRAAL_HOME)
        run: |
          mkdir -p "$HOME/tools"
          curl -fsSL -o /tmp/graalvm.tar.gz \
            https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_linux-x64_bin.tar.gz
          # Pinned since R66: the toolchain is part of the build contract,
          # and this job's tarball was never pinned because its first
          # successful run never happened (the AWT failure below). Same
          # release asset family as the macOS pin above.
          echo "b2bc38d0c4141426eb44d0eefa3cc172c96faf92727d703b61541699128b6fc7  /tmp/graalvm.tar.gz" | sha256sum -c -
          tar xzf /tmp/graalvm.tar.gz -C "$HOME/tools/"
          "$HOME/tools"/graalvm-community-*/bin/native-image --version
      - name: make linux
        run: make linux
      - name: Binary smoke
        run: |
          # ISOLATED, and that is the whole point (R97): native-image emits
          # libawt*.so BESIDE the binary, and a smoke run from ./build finds
          # them there. kosi ships ONE file, so the shipped binary must be
          # exercised the way it is shipped — alone. `version` asserting
          # every component available is what catches an AWT native creeping
          # back into the run-time path.
          mkdir -p /tmp/kosi-isolated
          cp ./build/kosi-linux-amd64 /tmp/kosi-isolated/
          cd /tmp/kosi-isolated
          ./kosi-linux-amd64 version | tee /tmp/version.json
          python3 -c 'import json,sys; c=json.load(open("/tmp/version.json"))["components"]; bad={k:v for k,v in c.items() if v!="available"}; sys.exit(f"components unavailable in an isolated binary: {bad}" if bad else 0)'
          ./kosi-linux-amd64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/weak-crypto" --out /tmp/a.json
          ./kosi-linux-amd64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/weak-crypto" --out /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
          ./kosi-linux-amd64 analyze --dir "$GITHUB_WORKSPACE/thirdparty/kosi/fixtures/command-exec" \
            --backend resolved --dataflow all --out /tmp/c.json
          grep -q 'taint/untrusted-input-to-process-exec' /tmp/c.json
