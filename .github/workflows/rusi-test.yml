name: rusi test

on:
  push:
    branches: [main]
    paths:
      - "thirdparty/rusi/**"
      - ".github/workflows/rusi-test.yml"
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: thirdparty/rusi

jobs:
  # The workflow runs on every pull request and merge-queue group so that its
  # required check always reports. This job decides which tests the change
  # needs: a job whose paths did not change is skipped, and the summary job at
  # the end counts a skip as a pass. Pushes and manual runs test everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rusi: ${{ steps.diff.outputs.rusi }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # A pull request is checked out as its merge commit, whose first
          # parent is the base branch tip.
          all=""
          case "$EVENT" in
            pull_request) files="$(git diff --name-only HEAD^1 HEAD)" ;;
            merge_group) files="$(git diff --name-only "$MG_BASE" "$MG_HEAD")" ;;
            *) files=""; all=1 ;;
          esac
          changed() { [ -n "$all" ] || printf '%s\n' "$files" | grep -qE "$1"; }
          if changed '^(thirdparty/rusi/|\.github/workflows/rusi-test\.yml$)'; then echo rusi=true; else echo rusi=false; fi >> "$GITHUB_OUTPUT"

  # Default test suite on stable. The rustc-wrapper crate is excluded from the
  # workspace default-members, so the whole default set builds and tests on
  # stable like any other project. Compiler-backend integration tests are
  # marked #[ignore] and are exercised in the nightly job below.
  #
  # Windows runs the same suite: unix-gated code paths compile out there, and
  # that is exactly where the cross-host breakages have hidden (a cfg(windows)
  # fixture gate flipping an asserted outcome, unused imports behind
  # #[cfg(unix)], a temp path written into TOML where \U is an escape — all
  # found by a Windows VM run).
  test:
    name: cargo test (stable, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rusi == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          rustc --version
      - name: cargo test
        shell: bash
        run: cargo test
      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo fmt
        shell: bash
        run: cargo fmt --check

  # Compiler-backend integration tests. These need a toolchain with the
  # rustc-dev and rust-src components (the embedded backend links rustc
  # internals via #![feature(rustc_private)]; RUSTC_BOOTSTRAP=1 unlocks that
  # on a release channel and is a no-op on nightly), and they shell out to a
  # nested cargo at runtime, so they are run single-threaded to avoid cargo
  # lock contention.
  #
  # The rustc_private API shape differs inside the supported window, and the
  # wrapper's build.rs probes for each fork. The legs cover the shapes:
  #   - the pinned nightly: the shape before every probed fork. Pinned so that
  #     neither a rustc-internals change nor a new clippy lint fails the job on
  #     its own; move it forward deliberately. It is the only nightly
  #     installed, so the driver's `auto` toolchain is exercised picking a lone
  #     dated nightly by its full name.
  #   - beta: the next stable release's shape, named explicitly through
  #     RUSI_TEST_TOOLCHAIN because `auto` never prefers a beta. This is the
  #     leg that would have caught 1.100 reshaping `use` items and MIR
  #     projections before it reached stable.
  #   - the rolling nightly: an early warning for forks still to come. Allowed
  #     to fail, and not linted, since nightly clippy moves on its own.
  #
  # Windows runs the pinned leg too: the wrapper links rustc_private on MSVC
  # there, and the embedded backend materializes and builds it through a
  # nested cargo. `shell: bash` everywhere because the install step's line
  # continuations are bash syntax.
  test-nightly:
    name: cargo +${{ matrix.toolchain }} test -- --ignored (compiler backend, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rusi == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: nightly-2026-08-21
            test-toolchain: ""
            canary: false
          - os: windows-latest
            toolchain: nightly-2026-08-21
            test-toolchain: ""
            canary: false
          - os: ubuntu-latest
            toolchain: beta
            test-toolchain: beta
            canary: false
          - os: ubuntu-latest
            toolchain: nightly
            test-toolchain: nightly
            canary: true
    permissions:
      contents: read
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      RUSI_TEST_TOOLCHAIN: ${{ matrix.test-toolchain }}
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain with rustc-dev, rust-src and clippy
        shell: bash
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --component rustc-dev --component rust-src --component llvm-tools \
            --component clippy --no-self-update
          rustup run "$TOOLCHAIN" rustc --version
      # The wrapper is outside the default members, so the other steps never
      # lint or unit-test it. Its tests drive the MIR data-flow fixpoints on
      # hand-built bodies and need no nested cargo, so they run first. Its
      # build script prints the rustc_private shape it detected.
      - name: cargo clippy (rustc-wrapper)
        if: ${{ !matrix.canary }}
        shell: bash
        run: cargo "+$TOOLCHAIN" clippy --locked -p rusi-rustc-wrapper --all-targets -- -D warnings
      - name: cargo test (rustc-wrapper)
        shell: bash
        run: cargo "+$TOOLCHAIN" test --locked -p rusi-rustc-wrapper
      - name: cargo test -- --ignored --test-threads=1
        shell: bash
        run: cargo "+$TOOLCHAIN" test -- --ignored --test-threads=1

  # The required status check for this workflow. It passes when every test job
  # above passed or was skipped because its paths did not change; a canary
  # toolchain row that may fail does not fail its job (continue-on-error).
  required:
    name: rusi tests
    if: always()
    needs: [changes, test, test-nightly]
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check the test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a test job ended with: $result"; exit 1 ;;
            esac
          done
